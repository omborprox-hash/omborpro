function openInvoices(cid){const c=S.customers[cid];if(!c)return {list:[],credit:0};const inv=invNos();

 const sales=arr('sales').filter(s=>s.cid===cid).sort((a,b)=>a.ts-b.ts);const bySale={};
 sales.forEach(s=>{const it={kind:'sale',s,ts:s.ts,total:s.total,paid:num(s.paid),rest:s.total-num(s.paid),no:inv[s.id],o:s.orderId&&S.orders[s.orderId]};items.push(it);bySale[s.id]=it});
 let pool=num(c.initDebt)<0?-num(c.initDebt):0;
 const ordSale={};sales.forEach(s=>{if(s.orderId)ordSale[s.orderId]=s.id});
 arr('payments').filter(p=>p.cid===cid).forEach(p=>{const sid=p.saleId||(p.orderId&&ordSale[p.orderId]);const it=sid&&bySale[sid];let a=num(p.amount);
  if(it){const t=Math.min(a,Math.max(0,it.rest));it.rest-=t;it.paid+=t;a-=t}pool+=a});
 items.forEach(it=>{if(pool<=0||it.rest<=0)return;const t=Math.min(pool,it.rest);it.rest-=t;it.paid+=t;pool-=t});
 return {list:items.filter(it=>it.rest>0.005),credit:pool}}

/* --- PDF dalolatnoma (oddiy PDF yozuvchi, tashqi kutubxonasiz) --- */
const PW=595,PH=842;
function pdfTxt(s){return String(s??'').replace(/[‘’ʻʼ`]/g,"'").replace(/[“”]/g,'"').replace(/[—–]/g,'-').replace(/≈/g,'~').replace(/№/g,'No').replace(/…/g,'...').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?')}
function tw(s,sz,b){let w=0;for(const ch of pdfTxt(s)){const c=ch.charCodeAt(0);w+=(/[0-9$]/.test(ch)?556:/[ ,.:;'!|il]/.test(ch)?278:/[A-Z]/.test(ch)?(b?722:667):/[mw]/.test(ch)?833:c>127?556:(b?611:530))}return w*sz/1000}
function newPdf(){const pages=[];let cur=null;const P={y:0,
 page(){cur=[];pages.push(cur);P.y=PH-50;return P},
 text(x,y,s,sz=10,b=false,align='l',col='0 0 0'){const t=pdfTxt(s);if(align==='r')x-=tw(t,sz,b);if(align==='c')x-=tw(t,sz,b)/2;cur.push(`BT ${col} rg /${b?'F2':'F1'} ${sz} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td (${t.replace(/[\\()]/g,m=>'\\'+m)}) Tj ET`)},
 line(x1,y1,x2,y2,w=.5,col='.75 .78 .8'){cur.push(`${col} RG ${w} w ${x1} ${y1} m ${x2} ${y2} l S`)},
 rect(x,y,w,h,col){cur.push(`${col} rg ${x} ${y} ${w} ${h} re f`)},
 out(){const objs=[];const add=s=>{objs.push(s);return objs.length};
  add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids=[];pages.forEach((pg,i)=>{const st=pg.join('\n')+`\nBT .55 .58 .62 rg /F1 8 Tf ${PW-80} 25 Td (${i+1} / ${pages.length}) Tj ET`;const cs=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cs} 0 R >>`))});
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let s='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];objs.forEach((o,i)=>{off.push(s.length);s+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=s.length;s+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i)&255;return new Blob([b],{type:'application/pdf'})}};return P}

/* ===== Sotuvchilar ===== */
let selMonth=(()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)})();
function monthRange(m){const [y,mo]=m.split('-').map(Number);return [new Date(y,mo-1,1).getTime(),new Date(y,mo,1).getTime()]}
/* --- Maosh: sof foydadan % (+ ixtiyoriy oylik va sotuvdan %) --- */
function payParts(sel){const legacy=sel.profitPct==null&&sel.salesPct==null;
 return {salary:legacy&&sel.payType==='percent'?0:num(sel.salary),pp:legacy?0:num(sel.profitPct),spc:legacy?(sel.payType==='percent'?num(sel.percent):0):num(sel.salesPct)}}
function payOf(sel,total,profit){const p=payParts(sel);return p.salary+Math.max(0,profit*p.pp/100)+total*p.spc/100}
function payDesc(sel){const p=payParts(sel);const a=[];if(p.pp)a.push('Sof foydadan '+p.pp+'%');if(p.spc)a.push('Sotuvdan '+p.spc+'%');if(p.salary)a.push('Oylik '+money(p.salary));return a.join(' + ')||'Belgilanmagan'}
function sellerStats(sel,from,to){const ss=arr('sales').filter(s=>s.sid===sel.id&&s.ts>=from&&s.ts<to);const total=sum(ss,s=>s.total),profit=sum(ss,profitOf);
 return {ss,n:ss.length,total,profit,paid:sum(ss,s=>s.paid),cust:new Set(ss.map(s=>s.cid).filter(Boolean)).size,pay:payOf(sel,total,profit)}}
/* --- Reyting --- */
function ratings(from,to){const st=arr('sellers').filter(s=>s.active!==false).map(s=>({s,...sellerStats(s,from,to)}));
 const mx=k=>Math.max(1e-9,...st.map(x=>x[k]));
 st.forEach(x=>{x.ps=x.total?x.paid/x.total:0;x.parts=x.n?[40*Math.max(0,x.profit)/mx('profit'),25*x.total/mx('total'),15*x.n/mx('n'),10*x.cust/mx('cust'),10*x.ps]:[0,0,0,0,0];x.score=Math.round(sum(x.parts,v=>v))});
 st.sort((a,b)=>b.score-a.score||b.profit-a.profit||byName(a.s,b.s));st.forEach((x,i)=>x.rank=i+1);return st}
const stars=sc=>{const f=Math.round(sc/20);return `<span class="stars" title="${sc}/100">${'★'.repeat(f)}<i>${'★'.repeat(5-f)}</i></span>`};
V.reyting=()=>{const [f,t]=rRange();const st=ratings(f,t);const prev=f>0?ratings(f-(t-f),f):[];const pr={};prev.forEach(x=>{if(x.n)pr[x.s.id]=x.rank});
 const top=st.filter(x=>x.n).slice(0,3);
 return `<div class="row"><div><h1>Sotuvchilar reytingi</h1><p class="sub">Har bir sotuvchi 100 ballik tizimda baholanadi</p></div><span class="sp"></span>${ROLE==='admin'?`<a class="btn" href="#sotuvchilar">← Sotuvchilar</a>`:''}</div>${periodBar()}
 ${top.length?`<div class="podium">${top.map(x=>`<div class="pod r${x.rank} ${x.s.id===ME?'me':''}"><span class="medal">${x.rank}</span><span class="avatar" style="width:52px;height:52px">${esc(initials(x.s.name))}</span><b>${esc(x.s.name)}</b><div class="score">${x.score}<small>/100</small></div>${stars(x.score)}<div class="small muted">Sof foyda ${money(x.profit)}</div></div>`).join('')}</div>`:''}
 <div class="card ctbl rtbl" style="padding:0"><div class="tw"><table><tr class="chead"><th>#</th><th>Sotuvchi</th><th>Ball</th><th class="n hide-m">Sof foyda</th><th class="n hide-m">Sotuv</th><th class="n hide-m">Cheklar</th><th class="n hide-m">Mijozlar</th><th class="n hide-m">Naqd ulushi</th><th class="n hide-m">O'zgarish</th></tr>
 ${st.length?st.map(x=>{const p=pr[x.s.id];const ch=p&&x.n?p-x.rank:null;return `<tr class="crow ${x.s.id===ME?'meRow':''}"><td><b>${x.rank}</b></td><td><div class="tl"><span class="avatar" style="width:36px;height:36px;font-size:13px">${esc(initials(x.s.name))}</span><span>${esc(x.s.name)}${x.s.id===ME?' <span class="chip ac">siz</span>':''}</span></div></td>
  <td><div class="sbar"><i style="width:${x.score}%"></i></div><div class="row" style="gap:6px"><b>${x.score}</b>${stars(x.score)}</div></td><td class="n hide-m">${money(x.profit)}</td><td class="n hide-m">${money(x.total)}</td><td class="n hide-m">${x.n}</td><td class="n hide-m">${x.cust}</td><td class="n hide-m">${Math.round(x.ps*100)}%</td>
  <td class="n hide-m">${ch==null?'<span class="muted">—</span>':ch>0?`<span style="color:var(--ok)">▲ ${ch}</span>`:ch<0?`<span style="color:var(--bad)">▼ ${-ch}</span>`:'<span class="muted">=</span>'}</td></tr>`}).join(''):`<tr><td colspan="9">${empty('Sotuvchilar yo\'q')}</td></tr>`}</table></div></div>
 <div class="card"><h3 style="margin-top:0">Ball qanday hisoblanadi</h3><div class="small muted">Har bir ko'rsatkich davrdagi eng yaxshi sotuvchiga nisbatan olinadi:</div>
 <div class="wlist"><span><b>40</b> sof foyda</span><span><b>25</b> sotuv summasi</span><span><b>15</b> cheklar soni</span><span><b>10</b> xizmat ko'rsatilgan mijozlar</span><span><b>10</b> naqd to'lov ulushi (qarzga kam sotish)</span></div>
 <div class="small muted">5 yulduz = 100 ball. “O'zgarish” — oldingi xuddi shunday davrga nisbatan o'rin qanchaga ko'tarilgani yoki tushgani.</div></div>`};

async function hashPw(salt,pw){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of salt+'|'+pw)h=((h*33)^c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}

function bucketOf(ts,m){const d=new Date(ts);if(m==='kun')return dayStart(ts);if(m==='hafta')return weekStart(ts);if(m==='oy')return new Date(d.getFullYear(),d.getMonth(),1).getTime();return new Date(d.getFullYear(),0,1).getTime()}
function bucketPrev(k,m,n){const d=new Date(k);if(m==='kun')d.setDate(d.getDate()-n);else if(m==='hafta')d.setDate(d.getDate()-7*n);else if(m==='oy')d.setMonth(d.getMonth()-n);else d.setFullYear(d.getFullYear()-n);return d.getTime()}

 if(m==='hafta'){const e=new Date(k+6*864e5);return short?d.getDate()+' '+MONS[d.getMonth()]:d.getDate()+' '+MONS[d.getMonth()]+' – '+e.getDate()+' '+MONS[e.getMonth()]+' '+e.getFullYear()}
 if(m==='oy')return short?MONS[d.getMonth()]:MONF[d.getMonth()]+' '+d.getFullYear();return String(d.getFullYear())}

 im.onload=()=>{let s=1100,q=.7,out='';for(let t=0;t<6;t++){const c=document.createElement('canvas');const k=Math.min(1,s/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<200000)break;s*=.8;q=Math.max(.45,q-.07)}

function parseCSV(txt){const out=[];let row=[],f='',q=false;const d=(txt.split('\n')[0].split(';').length>txt.split('\n')[0].split(',').length)?';':',';
 for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);out.push(row);row=[];f=''}else if(c!=='\r')f+=c}
 if(f||row.length){row.push(f);out.push(row)}return out}

   items.forEach((it,k)=>{const st=sn[k].exists?num(sn[k].data().stock):0;if(st<it.qty)throw {code:'stock',msg:it.name+': mavjud '+qty(Math.max(0,st))}});
   const n=cs.exists?num(cs.data().n)+1:14001;t.update(cref,{n});items.forEach((it,k)=>t.update(refs[k],{stock:r2(num(sn[k].data().stock)-it.qty)}));
   t.set(fdb.doc('orders/'+id),{...ord,no:n});return n})}
 catch(x){ordBusy=false;toast(x&&x.code==='stock'?x.msg+' — boshqa mijoz oldinroq buyurtma qildi':fbErr(x));return false}
 ordBusy=false;S.orders={...S.orders,[id]:{...ord,no}};
 if(f.address.trim()&&f.address.trim()!==c.address)await save('customers',{...c,address:f.address.trim()});
 acart={};saveACart();A.tab='orders';A.ord=id;render(true);scrollTo(0,0);modal(`<div style="text-align:center;padding:10px 0"><div class="aok">✓</div><h2>Buyurtma #${no} qabul qilindi!</h2><p class="muted">Holatini “Buyurtmalar” bo'limida kuzatib borasiz. Tez orada siz bilan bog'lanamiz.</p><button class="btn pri wide" onclick="closeModal()">Yaxshi</button></div>`);return false}
async function impWrite(p){try{await save('products',p);return true}catch(e){return false}}

/* --- Eski OmborPro zaxira nusxasidan ko'chirish --- */
let RS=null;
async function rsFile(inp){if(adminOnly())return;const f=inp.files&&inp.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||typeof j!=='object'||!j.products)throw 0;
 const cnt=COLS.map(c=>[c,Object.keys(j[c]||{}).length]).filter(x=>x[1]);RS={j,cnt,done:0,total:0,running:false,err:0};
 modal(`<h2>Ko'chirishni tasdiqlang</h2><p class="muted">${esc(f.name)}</p><div class="list">${cnt.map(([c,n])=>`<div class="it"><span>${c}</span><b>${n}</b></div>`).join('')}</div>
 <p class="small muted">Mahsulotlar, mijozlar, sotuvlar, to'lovlar, qarzlar va boshqa barcha ma'lumotlar yangi bazaga yoziladi. Sotuvchilarga parol va mijozlarga PIN kodni keyin qaytadan berasiz.</p>
 <button class="btn pri wide" onclick="rsRun()">Ko'chirishni boshlash</button>`)}catch(e){toast('Bu fayl OmborPro zaxira nusxasi emas')}}
async function rsRun(){if(!RS||RS.running)return;RS.running=true;const j=RS.j;const ops=[];const big=[];
 const keep={...S};COLS.forEach(c=>S[c]=j[c]||{});C=compute0();
 const st={...(j.settings||{})};delete st.adminHash;delete st.adminSalt;ops.push(['config/settings',{...DEF,...st}]);
 const sales=Object.values(j.sales||{}).sort((a,b)=>a.ts-b.ts);sales.forEach((s,i)=>{ops.push(['sales/'+s.id,{...s,no:s.no||i+1}])});ops.push(['counters/sales',{n:sales.length}]);
 ops.push(['counters/orders',{n:Math.max(14000,...Object.values(j.orders||{}).map(o=>+o.no||0))}]);
 Object.values(j.products||{}).forEach(p=>{const d={...p};const img=d.img;delete d.img;if(img){d.hasImg=true;big.push(['pimg/'+p.id,{img}])}ops.push(['products/'+p.id,d]);ops.push(['catalog/'+p.id,pubOf(d)])});
 Object.values(j.customers||{}).forEach(c=>{const d={...c};delete d.pinHash;delete d.pinSalt;delete d.authUid;d.pinSet=false;ops.push(['customers/'+c.id,d]);const dg=digits(c.phone);if(dg)ops.push(['logins/m_'+dg,{cid:c.id,email:''}])});
 Object.values(j.sellers||{}).forEach(s=>{const d={...s};delete d.hash;delete d.salt;delete d.uid;ops.push(['sellers/'+s.id,d])});
 ['receipts','payments','expenses','orders','suppliers','porders','categories'].forEach(c=>Object.values(j[c]||{}).forEach(x=>{const d={...x};if(c==='expenses'&&d.img&&d.img.length>700000)delete d.img;ops.push([c+'/'+x.id,d])}));
 COLS.forEach(c=>S[c]=keep[c]);RS.total=ops.length+big.length;RS.done=0;
 const draw=()=>{const el=$('#sheet');if(el)el.innerHTML=`<h2>${RS.running?'Ko\'chirilmoqda…':'Tayyor!'}</h2><div class="pbar"><i style="width:${Math.round(RS.done/RS.total*100)}%"></i></div><p>${RS.done} / ${RS.total}${RS.err?` · <span style="color:var(--bad)">xato: ${RS.err}</span>`:''}</p>${RS.running?'<p class="small muted">Sahifani yopmang.</p>':`<button class="btn pri wide" onclick="closeModal();location.hash='dashboard'">Boshqaruv paneliga o'tish</button>`}`};draw();
 const commit=async(list,size)=>{for(let i=0;i<list.length;i+=size){const part=list.slice(i,i+size);for(let t=0;t<4;t++){try{const b=fdb.batch();part.forEach(([p,d])=>b.set(fdb.doc(p),JSON.parse(JSON.stringify(d))));await b.commit();break}catch(e){if(t===3){RS.err+=part.length;console.warn(e)}else await sleep(1500*(t+1))}}RS.done+=part.length;draw()}};
 await commit(ops,400);await commit(big,15);RS.running=false;draw();toast('Ko\'chirish tugadi')}

setSync('loading');render(true);fbBoot();
</script>
